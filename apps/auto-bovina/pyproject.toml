[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samcom-auto-bovina"
version = "0.3.0"
description = "Recovered compatibility core for the autoBovina desktop workflow"
requires-python = ">=3.12,<3.15"

[project.optional-dependencies]
windows = [
  "pydirectinput==1.0.4",
  "pyautogui==0.9.54",
  "pyperclip==1.11.0",
  "pywinauto==0.6.9",
  "pywin32==312",
  "xlwings==0.36.14",
]
build = ["pyinstaller==6.22.0"]

[project.scripts]
auto-bovina = "autobovina.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autobovina"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "autobovina/data"
